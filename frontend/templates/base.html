
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#14212d">
    <meta name="description" content="RestoMenu - Hệ thống quản lý nhà hàng Nhật Bản">

    <title>{% block title %}RestoMenu | Nghệ thuật ẩm thực Nhật{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS chính -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Nội dung từng trang -->
    {% block content %}
    {% endblock %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript hệ thống -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
