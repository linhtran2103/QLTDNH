{% extends "base.html" %}

{% block title %}Thực đơn và đặt món | RestoMenu{% endblock %}

{% block content %}
<main class="container py-4">
    <header class="text-center mb-4">
        <a href="/" class="navbar-brand fw-bold text-decoration-none">RestoMenu</a>
        <h1 class="h3 fw-bold mt-3 mb-1" id="tableName">Đang tải bàn...</h1>
        <p class="text-muted">Chọn món và gửi yêu cầu đến nhân viên.</p>
    </header>

    <div id="orderMessage" class="alert d-none" role="alert"></div>
    <div class="row g-4">
        <section class="col-lg-8">
            <h2 class="h5 fw-bold mb-3">Thực đơn</h2>
            <div id="menuItems" class="row g-3">
                <div class="col-12 text-muted">Đang tải thực đơn...</div>
            </div>
        </section>
        <aside class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 fw-bold">Đơn của bạn</h2>
                    <div id="cartItems" class="mb-3 text-muted">Chưa chọn món.</div>
                    <label class="form-label" for="orderNote">Ghi chú cho nhà hàng</label>
                    <textarea id="orderNote" class="form-control mb-3" rows="3"
                        maxlength="500" placeholder="Ví dụ: ít cay, không hành..."></textarea>
                    <button id="submitOrder" class="btn btn-primary w-100" disabled>
                        Gửi đơn
                    </button>
                </div>
            </div>
        </aside>
    </div>
</main>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const tableId = {{ ma_ban|tojson }};
    const qrToken = {{ qr_token|tojson }};
    const menuElement = document.getElementById("menuItems");
    const cartElement = document.getElementById("cartItems");
    const messageElement = document.getElementById("orderMessage");
    const submitButton = document.getElementById("submitOrder");
    const cart = new Map();
    const money = value => new Intl.NumberFormat("vi-VN", {
        style: "currency", currency: "VND"
    }).format(Number(value) || 0);
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
    const publicRequest = async url => {
        const response = await fetch(url);
        const result = await response.json();
        if (!response.ok || result.status !== "success") {
            throw new Error(result.message || "Không tải được dữ liệu.");
        }
        return result.data;
    };

    function renderCart() {
        const items = [...cart.values()];
        submitButton.disabled = items.length === 0;
        if (!items.length) {
            cartElement.textContent = "Chưa chọn món.";
            return;
        }
        cartElement.innerHTML = items.map(item => `
            <div class="d-flex justify-content-between align-items-start border-bottom py-2">
                <div>
                    <strong>${escapeHTML(item.TenMonAn)}</strong>
                    <div class="small text-muted">${money(item.Gia)} × ${item.SoLuong}</div>
                </div>
                <div class="btn-group btn-group-sm" role="group">
                    <button class="btn btn-outline-secondary" data-change="${item.MaMonAn}" data-step="-1">−</button>
                    <button class="btn btn-outline-secondary" data-change="${item.MaMonAn}" data-step="1">+</button>
                </div>
            </div>`).join("");
        cartElement.querySelectorAll("[data-change]").forEach(button => {
            button.addEventListener("click", () => {
                const item = cart.get(Number(button.dataset.change));
                item.SoLuong += Number(button.dataset.step);
                if (item.SoLuong < 1) cart.delete(item.MaMonAn);
                renderCart();
            });
        });
    }

    try {
        const [table, menu] = await Promise.all([
            publicRequest(`/api/public/ban/${tableId}?token=${encodeURIComponent(qrToken)}`),
            publicRequest("/api/public/menu")
        ]);
        document.getElementById("tableName").textContent = table.TenBan;
        menuElement.replaceChildren();
        if (!menu.length) {
            menuElement.textContent = "Nhà hàng chưa có món đang phục vụ.";
        }
        menu.forEach(food => {
            const column = document.createElement("div");
            column.className = "col-12 col-md-6";
            column.innerHTML = `
                <article class="card h-100">
                    ${food.HinhAnh ? `<img src="${escapeHTML(food.HinhAnh)}"
                        class="card-img-top" alt="${escapeHTML(food.TenMonAn)}"
                        style="height:180px;object-fit:cover">` : ""}
                    <div class="card-body d-flex flex-column">
                        <small class="text-muted">${escapeHTML(food.TenDanhMuc)}</small>
                        <h3 class="h6 fw-bold mt-1">${escapeHTML(food.TenMonAn)}</h3>
                        <p class="small text-muted flex-grow-1">${escapeHTML(food.MoTa || "")}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <strong>${money(food.Gia)}</strong>
                            <button class="btn btn-sm btn-outline-primary" type="button">Thêm</button>
                        </div>
                    </div>
                </article>`;
            column.querySelector("button").addEventListener("click", () => {
                const id = Number(food.MaMonAn);
                const item = cart.get(id) || {
                    MaMonAn: id, TenMonAn: food.TenMonAn,
                    Gia: food.Gia, SoLuong: 0
                };
                if (item.SoLuong >= 50) return;
                item.SoLuong += 1;
                cart.set(id, item);
                renderCart();
            });
            menuElement.appendChild(column);
        });
    } catch (error) {
        document.getElementById("tableName").textContent = "Không tải được bàn";
        menuElement.textContent = error.message;
        return;
    }

    submitButton.addEventListener("click", async () => {
        submitButton.disabled = true;
        try {
            const response = await fetch("/api/public/don-hang", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    MaBan: tableId,
                    QrToken: qrToken,
                    GhiChu: document.getElementById("orderNote").value,
                    ChiTiet: [...cart.values()].map(item => ({
                        MaMonAn: item.MaMonAn, SoLuong: item.SoLuong
                    }))
                })
            });
            const result = await response.json();
            if (!response.ok || result.status !== "success") {
                throw new Error(result.message || "Không gửi được đơn.");
            }
            messageElement.className = "alert alert-success";
            messageElement.textContent =
                `${result.message}. Mã đơn #${result.data.MaDonHang}.`;
            messageElement.classList.remove("d-none");
            cart.clear();
            document.getElementById("orderNote").value = "";
            renderCart();
        } catch (error) {
            messageElement.className = "alert alert-danger";
            messageElement.textContent = error.message;
            messageElement.classList.remove("d-none");
            submitButton.disabled = cart.size === 0;
        }
    });
});
</script>
{% endblock %}
